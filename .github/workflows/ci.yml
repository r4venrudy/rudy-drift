name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
          - os: windows-latest
            artifact: windows-x64
          - os: macos-latest
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix install
      - name: Build installed-package consumer
        run: cmake -S examples/consumer -B build-consumer -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install" -DCMAKE_BUILD_TYPE=Release
      - name: Link installed-package consumer
        run: cmake --build build-consumer --config Release
      - name: Smoke test installed CLI and library
        shell: bash
        run: |
          ./install/bin/rudy-drift fit examples/train.csv examples/calibration.csv smoke.rdm
          ./install/bin/rudy-drift score smoke.rdm examples/observations.csv
          ./install/bin/rudy-drift zeek examples/conn.log
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build-consumer/Release/drift-consumer smoke.rdm 7.1 1.03 0.25
          else
            ./build-consumer/drift-consumer smoke.rdm 7.1 1.03 0.25
          fi
      - name: Package
        shell: python
        run: |
          import pathlib, shutil
          pathlib.Path('dist').mkdir()
          shutil.make_archive('dist/rudy-drift-${{ matrix.artifact }}', 'zip', 'install')
      - uses: actions/upload-artifact@v4
        with:
          name: rudy-drift-${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Clang sanitizers
        run: cmake -S . -B build -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -DRD_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test with ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sanitizers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rudy-drift-*
          path: dist
          merge-multiple: true
      - name: Hash release files
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Publish tested preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --verify-tag --prerelease --title "Rudy Drift $GITHUB_REF_NAME" --notes-file docs/release-notes.md
